<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Resposta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Criar Resposta</h1>

    <form id="formulario">
        <label for="idpergunta">ID da pergunta:</label>
        <input type="number" id="idpergunta" name="idpergunta" required>
        <label for="resposta">Resposta:</label>
        <input type="text" id="resposta" name="resposta" required>
        <label for="certa">Esta resposta é:</label>
        <select id="certa" name="certa">
            <option value="2">Errada</option>
            <option value="1">Correta</option>
        </select>
        <button type="submit">Cadastrar resposta</button>
    </form>
    <p id="mensagem"></p>

    <a class="voltar" href="index.html">Voltar ao menu</a>

    <script>
        const formulario = document.getElementById('formulario');
        const mensagem = document.getElementById('mensagem');

        formulario.addEventListener('submit', async function (evento) {
            evento.preventDefault();
            try {
                const resposta = await fetch('criar_resposta.php', {
                    method: 'POST',
                    body: new FormData(formulario)
                });
                const dados = await resposta.json();
                mensagem.textContent = dados.mensagem;
                mensagem.className = dados.sucesso ? 'ok' : 'erro';
                if (dados.sucesso) formulario.reset();
            } catch (erro) {
                mensagem.textContent = 'Erro ao se comunicar com o servidor.';
                mensagem.className = 'erro';
            }
        });
    </script>
</body>
</html>
