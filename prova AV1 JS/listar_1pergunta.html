<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar uma Pergunta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Listar uma Pergunta</h1>

    <form id="formulario">
        <label for="id">ID da pergunta:</label>
        <input type="number" id="id" name="id" required>
        <button type="submit">Buscar</button>
    </form>
    <p id="mensagem"></p>
    <div id="resultado"></div>

    <a class="voltar" href="index.html">Voltar ao menu</a>

    <script>
        const formulario = document.getElementById('formulario');
        const mensagem = document.getElementById('mensagem');
        const resultado = document.getElementById('resultado');

        formulario.addEventListener('submit', async function (evento) {
            evento.preventDefault();
            resultado.innerHTML = '';
            mensagem.textContent = '';
            try {
                const resposta = await fetch('listar_1pergunta.php', {
                    method: 'POST',
                    body: new FormData(formulario)
                });
                const dados = await resposta.json();

                if (!dados.sucesso) {
                    mensagem.textContent = dados.mensagem;
                    mensagem.className = 'erro';
                    return;
                }

                const titulo = document.createElement('p');
                titulo.textContent = 'ID: ' + dados.id + ' - ' + dados.pergunta;
                resultado.appendChild(titulo);

                dados.respostas.forEach(function (r, i) {
                    const linha = document.createElement('p');
                    linha.textContent = (i + 1) + ') ' + r.resposta + (r.certa ? ' (correta)' : '');
                    if (r.certa) linha.className = 'certa';
                    resultado.appendChild(linha);
                });
            } catch (erro) {
                mensagem.textContent = 'Erro ao se comunicar com o servidor.';
                mensagem.className = 'erro';
            }
        });
    </script>
</body>
</html>
