<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Pergunta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Alterar Pergunta</h1>

    <form id="formulario">
        <label for="id">ID da pergunta que deseja alterar:</label>
        <input type="number" id="id" name="id" required>
        <button type="button" id="carregar">Carregar dados atuais</button>

        <label for="pergunta">Nova pergunta:</label>
        <input type="text" id="pergunta" name="pergunta" required>
        <label>Novas respostas (marque a correta):</label>
        <div class="opcao">
            <input type="radio" name="correta" value="1" required>
            <input type="text" id="r1" name="r1" placeholder="Resposta 1" required>
        </div>
        <div class="opcao">
            <input type="radio" name="correta" value="2" >
            <input type="text" id="r2" name="r2" placeholder="Resposta 2" required>
        </div>
        <div class="opcao">
            <input type="radio" name="correta" value="3" >
            <input type="text" id="r3" name="r3" placeholder="Resposta 3" required>
        </div>
        <div class="opcao">
            <input type="radio" name="correta" value="4" >
            <input type="text" id="r4" name="r4" placeholder="Resposta 4" required>
        </div>
        <button type="submit">Alterar</button>
    </form>
    <p id="mensagem"></p>

    <a class="voltar" href="index.html">Voltar ao menu</a>

    <script>
        const formulario = document.getElementById('formulario');
        const mensagem = document.getElementById('mensagem');

        function mostrar(texto, ok) {
            mensagem.textContent = texto;
            mensagem.className = ok ? 'ok' : 'erro';
        }

        // preenche o formulário com os dados atuais da pergunta
        document.getElementById('carregar').addEventListener('click', async function () {
            const dadosEnvio = new FormData();
            dadosEnvio.append('id', document.getElementById('id').value);
            try {
                const resposta = await fetch('listar_1pergunta.php', { method: 'POST', body: dadosEnvio });
                const dados = await resposta.json();
                if (!dados.sucesso) { mostrar(dados.mensagem, false); return; }

                document.getElementById('pergunta').value = dados.pergunta;
                dados.respostas.slice(0, 4).forEach(function (r, i) {
                    document.getElementById('r' + (i + 1)).value = r.resposta;
                    if (r.certa) formulario.correta[i].checked = true;
                });
                mostrar('Dados carregados. Edite e clique em Alterar.', true);
            } catch (erro) {
                mostrar('Erro ao se comunicar com o servidor.', false);
            }
        });

        formulario.addEventListener('submit', async function (evento) {
            evento.preventDefault();
            try {
                const resposta = await fetch('alterar_pergunta.php', {
                    method: 'POST',
                    body: new FormData(formulario)
                });
                const dados = await resposta.json();
                mostrar(dados.mensagem, dados.sucesso);
            } catch (erro) {
                mostrar('Erro ao se comunicar com o servidor.', false);
            }
        });
    </script>
</body>
</html>
